<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>RHAD single image post</title>
<!-- RHAD single image, 1080x1350. Image area on the right/bottom, headline top-left. Edit text only. -->
<link rel="stylesheet" href="../tokens/rhad-tokens.css">
<style>
  @page { size: 1080px 1350px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-text); color: var(--rhad-ink); background: var(--rhad-white); }
  .frame { position: relative; width: 1080px; height: 1350px; padding: var(--margin); overflow: hidden; display: flex; flex-direction: column; }
  .top { font-weight: 600; font-size: 26px; color: var(--rhad-ink-soft); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 112px; line-height: .95; letter-spacing: -.04em; margin-top: 72px; position: relative; z-index: 2; max-width: 860px; }
  .accent { color: var(--rhad-red); }
  /* Subject image: put the master monochrome portrait here. The sharp subject sits right/bottom, white area stays clear for the headline. */
  .art { position: absolute; right: 0; bottom: 0; width: 1080px; height: 860px; background-image: url("../imagery/rhad-master-imagery-reference.png"); background-size: cover; background-position: center bottom; z-index: 1; }
  .bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; position: relative; z-index: 2; font-weight: 600; font-size: 26px; color: var(--rhad-white); }
  .bottom img { height: 40px; display: block; }
  /* No pills or boxes behind text. Footer text sits on the image in white only where the image is dark; otherwise switch to ink. */
</style>
</head>
<body>
<div class="frame">
  <div class="top">@rhad.agency</div>
  <h1>Say the one thing <span class="accent">clearly.</span></h1>
  <div class="art" role="img" aria-label="[NEEDS: alt text describing the image]"></div>
  <div class="bottom"><span></span><img src="../rhad/logos/rhad-logo-white-tight.png" alt="RHAD"></div>
</div>
</body>
</html>
